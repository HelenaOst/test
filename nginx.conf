server {
    listen 80;
    server_name localhost;
    index index.html;
    root /usr/share/nginx/html;
    client_max_body_size 20M;

    location / {
    #try_files $uri$args$/ /index.html;
    try_files $uri $uri/ /index.html?$args;
    }

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
    }
}